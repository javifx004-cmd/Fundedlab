# Despliegue del curso (carpeta curso/) en Render: https://render.com/deploy?repo=https://github.com/javifx004-cmd/Fundedlab/tree/curso-app
# Necesita un plan con disco persistente para guardar alumnos, sesiones y vídeos con marca de agua.
services:
  - type: web
    name: fundedlab-curso
    runtime: docker
    dockerfilePath: ./curso/Dockerfile
    dockerContext: ./curso
    plan: starter
    healthCheckPath: /api/config
    disk:
      name: datos
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BASE_URL
        sync: false
      - key: CONTENT_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: COURSE_PRICE_LABEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Tu correo (acceso gratis sin caducidad y panel de alumnos en /admin)
      - key: ADMIN_EMAILS
        sync: false
      # Contraseña del panel de alumnos (mínimo 8 caracteres)
      - key: ADMIN_PASSWORD
        sync: false
      - key: ACCESS_MONTHS
        value: "3"
      - key: MAX_DEVICES
        value: "2"
