<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <title>Entrar · Curso Funded Lab</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/entrar.js" defer></script>
</head>
<body>
  <main class="center-page">
    <form class="card login" id="form">
      <a class="brand" href="/"><img src="/icons/icon.svg" alt="">Funded<b>_lab</b></a>
      <h1>Entrar al curso</h1>
      <p class="muted" style="margin:0">Escribe el correo con el que compraste el curso y te enviaremos un enlace para entrar en este dispositivo. Sin contraseñas.</p>
      <div class="msg hidden" id="msg"></div>
      <input class="input" type="email" id="email" required placeholder="tu@correo.com" autocomplete="email">
      <button class="btn primary big" id="send">Enviarme el enlace</button>
      <a href="/" class="muted" style="text-align:center;font-size:14px">¿Aún no tienes el curso? Cómpralo aquí</a>
      <p class="muted" style="text-align:center;font-size:14px;margin:0">¿Problemas para entrar? Escríbenos a <a href="mailto:grupolab@proton.me">grupolab@proton.me</a></p>
      <a href="/admin" class="muted" style="text-align:center;font-size:13px">Acceso de administrador</a>
    </form>
  </main>
</body>
</html>
